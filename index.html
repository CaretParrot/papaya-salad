<!DOCTYPE html>
<html lang='en'>

    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <title>Document</title>
        <link rel='icon' href='https://caretparrot.github.io/papaya-salad/Profile%20Picture.png'>
        <link rel='stylesheet' href="https://caretparrot.github.io/papaya-palettes/default.css">
        <script src="https://caretparrot.github.io/papaya-palettes/script.js"></script>
        <script src="./script.js"></script>
        <script src="./components.js"></script>
        <script src="./math-plus.js"></script>
    </head>

    <body>
        <div id="homePage" class="page">
            <div id="slideshow">
                <h1>Hello!</h1>
                <h1>Welcome to papaya-salad.js!</h1>
                <h1>I'm glad you are here!</h1>
            </div>
            <input id="textBox" value="hmmm">
            <input id="textBox2" value="hm">
            <textarea id="textArea" value="hi">Hi</textarea>
            <p>Papaya salad is a lightweight Javascript library that adds additional features that make working with
                Javascript a little easier!</p>
            <button id="nextPage" onclick="pg.changePage('empty')">Next Page</button>
            <input type="file" onchange="getFile()" id="fileInput">
            <button onclick="displayData()">Display Data</button>
        </div>
        <div id="empty" class="page">
            <p>Hahaha this is not empty...</p>
            <button id="previousPage" onclick="pg.changePage('homePage')">Previous Page</button>
        </div>

        <script>
            let slideshow = new SlideShow(document.getElementById("slideshow"));
            slideshow.clickable();

            /* let p = new SimplePallete(); */
            let pg = new PageGroup("page", "grid");
            let db = new Database();
            let tv;

            function getFile() {
                db.importFile(document.getElementById("fileInput").files[0]);
            }

            function displayData() {
                tv = new TableView(db, document.body);
            }

            let graph = new Graph(document.body);
            graph.width = 300;
            graph.height = 300;
            graph.lineWidth = 3;
            graph.vectors = [new Vector([0, 0], [100, 50]), new Vector([0, 0], [70, 80])];
        </script>
    </body>

</html>
