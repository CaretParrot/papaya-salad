<!DOCTYPE html>
<html lang='en'>

    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <title>Document</title>
        <link rel='icon' href='https://caretparrot.github.io/My-Libraries/Profile%20Picture.png'>
        <link rel='stylesheet' href='https://caretparrot.github.io/My-Libraries/default.css'>
        <link rel='stylesheet' href='./style.css'>
        <script src="./script.js"></script>
    </head>

    <body>
        <div id="homePage" class="pages">
            <div id="slideshow" style="margin: 1rem;">
                <h1>Hello!</h1>
                <h1>Welcome to papaya-salad.js!</h1>
                <h1>I'm glad you are here!</h1>
            </div>
            <input id="textBox" value="hmmm">
            <textarea id="textLabel"></textarea>
            <p>Papaya salad is a lightweight Javascript library that adds additional features that make working with
                Javascript a little easier!</p>
            <button id="nextPage">Next Page</button>
        </div>
        <div id="empty" class="pages">
            <p>Hahaha this is not empty...</p>
            <button id="previousPage">Previous Page</button>
        </div>

        <script>
            id.setupTree();
            let slideshow = new SlideShow(id.slideshow);
            let pageGroup = new PageGroup("pages", "grid");
            slideshow.clickable();
            let newVar = "hmmmm";

            id.nextPage.onclick = function () {
                pageGroup.changePage("empty");
                colorPalletes.paint();
            }

            id.previousPage.onclick = function () {
                pageGroup.changePage("homePage");
            }

            binder.bind(id.textBox, "value", id.textLabel, "value", true);
        </script>
    </body>

</html>
